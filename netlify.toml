[build]
  command = "npm run build:web"
  publish = "web/public"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/data/photos/photos-*.bin"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
